<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Form</title>
  <link rel="stylesheet" href="payment.css" />
</head>
<body>
  <div class="container">
    <form action="">
      <h1 class="main_heading">Payment Form</h1>
      <p><em>Required fields are marked with *</em></p>

      <h2>Contact Information</h2>

      <p>
        <label for="name">Name: *</label><br />
        <input type="text" id="name" name="name" placeholder="e.g., Mahi" required />
      </p>

      <fieldset>
        <legend>Gender *</legend>
        <p>
          <label for="male">
            <input type="radio" id="male" name="gender" required />
            Male
          </label>
          <label for="female" style="margin-left:20px;">
            <input type="radio" id="female" name="gender" required />
            Female
          </label>
        </p>
      </fieldset>

      <p>
        <label for="address">Address:</label><br />
        <textarea id="address" name="address" cols="100" rows="4" placeholder="Enter your address"></textarea>
      </p>

      <p>
        <label for="email">Email: *</label><br />
        <input type="email" id="email" name="email" placeholder="example@mail.com" required />
      </p>

      <p>
        <label for="pincode">Pincode: *</label><br />
        <input type="number" id="pincode" name="pincode" required />
      </p>

      <hr />

      <h2>Payment Information</h2>

      <p>
        <label for="card_type">Card Type: *</label><br />
        <select id="card_type" name="card_type" required>
          <option value="">-- Select a card type --</option>
          <option value="visa">Visa</option>
          <option value="mastercard">Mastercard</option>
          <option value="sbi">SBI</option>
          <option value="hdfc">HDFC</option>
        </select>
      </p>

      <p>
        <label for="card_number">Card Number: *</label><br />
        <input type="number" id="card_number" name="card_number" required />
      </p>

      <p>
        <label for="exp_date">Expiration Date: *</label><br />
        <input type="date" id="exp_date" name="exp_date" required />
      </p>

      <p>
        <label for="CVV">CVV: *</label><br />
        <input type="password" id="CVV" name="CVV" required />
      </p>

      <input type="submit" value="Pay Now" />
    </form>
  </div>
</body>
</html>
